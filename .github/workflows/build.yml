# Builds eureka! for Windows (VST3 + standalone app) on GitHub's servers.
#
# - Every push to master or eureka-plugin, or a manual run (Actions tab >
#   "Build" > "Run workflow"): download the zip from the run's Artifacts.
# - Pushing a tag such as v1.1.0 also attaches eureka-windows.zip to a
#   GitHub release for that tag.
name: Build

on:
  push:
    branches: [master, eureka-plugin]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # Needed to attach the zip to a release on tags.

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # clang-cl (Visual Studio's ClangCL toolset): the Ambika firmware needs
      # GCC/Clang extensions that MSVC's own compiler rejects.
      - name: Configure
        run: cmake -S plugin -B build -A x64 -T ClangCL

      # On failure, the compiler errors are also posted as annotations, so
      # they show on the run's summary page without opening the log.
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) {
            $errors = Select-String -Path build-log.txt -Pattern '(: error|error:|fatal error|LNK\d{4}|CMake Error)' |
              ForEach-Object { $_.Line.Trim() } | Select-Object -Unique | Select-Object -First 10
            foreach ($e in $errors) {
              $msg = $e -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
              Write-Output "::error::$msg"
            }
            exit 1
          }

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $artefacts = "build/AmbikaPlugin_artefacts/Release"
          $out = "dist/eureka-windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse -LiteralPath "$artefacts/VST3/eureka!.vst3" -Destination $out
          Copy-Item -LiteralPath "$artefacts/Standalone/eureka!.exe" -Destination $out
          Copy-Item -LiteralPath "plugin/packaging/INSTALL-Windows.txt" -Destination "$out/INSTALL.txt"
          Compress-Archive -Path "$out" -DestinationPath "dist/eureka-windows.zip" -Force
          Get-ChildItem -Recurse $out | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: eureka-windows
          path: dist/eureka-windows

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/eureka-windows.zip
